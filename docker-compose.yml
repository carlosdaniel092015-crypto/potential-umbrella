# Entorno dev local (§4.1). .env es SOLO para dev con credenciales sandbox;
# staging/prod usan gestor de secretos (§5.4, decisión D-09).
services:
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    env_file: .env
    environment:
      DB_HOST: postgres
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_fase1"
    depends_on:
      postgres:
        condition: service_healthy

  core_api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: core_api
    env_file: .env
    environment:
      DB_HOST: postgres
      PROCESSING_MODE: celery
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/2
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin_panel:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: admin_panel
    env_file: .env
    environment:
      DB_HOST: postgres
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    # pgvector desde el día 1 (ADR-02): cambiar la imagen después implica migrar el volumen.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-whatsapp_ai}
      POSTGRES_USER: ${DB_USER:-whatsapp_ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir en .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-whatsapp_ai} -d ${DB_NAME:-whatsapp_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF: el broker de Celery SÍ es crítico (hallazgo de la revisión sobre DR §4.6).
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--requirepass", "${REDIS_PASSWORD:-devredis}",
      ]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devredis} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
