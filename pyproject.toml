[project]
name = "whatsapp-ai-platform"
version = "0.1.0"
description = "Sistema de IA conversacional multiagente para WhatsApp — Sued Fargesa"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "django>=5.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "langgraph>=0.2",
    "openai>=1.40",
    "httpx>=0.27",
    "gunicorn>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=6.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["apps/shared/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apps.admin_panel.settings.test"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["apps/core_api", "apps/shared"]
omit = ["apps/shared/migrations/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# django-stubs: sin el plugin, mypy infiere los miembros de TextChoices como
# tuple[str, str] (el literal del enum) y reporta falsos positivos.
plugins = ["mypy_django_plugin.main"]
exclude = ["apps/shared/migrations/"]

[tool.django-stubs]
django_settings_module = "apps.admin_panel.settings.test"
